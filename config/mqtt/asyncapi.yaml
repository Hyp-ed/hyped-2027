# TODO: motor command, HVAL green & right light status, faults
asyncapi: 3.1.0
info:
  title: MQTT messages from the Pod to base station
  version: 1.0.0
  description: Operations are described from the pod's point of view. `send` is a message the pod publishes, and `receive` is one the base station publishes to the pod.
defaultContentType: application/cbor

servers:
  production:
    host: random broker servers
    protocol: mqtt

channels:
  register:
    address: hyped/{podId}/register
    parameters:
      podId:
        description: the id of the pod
        default: "0"
    messages:
      request:
        contentType: application/cbor
        payload:
          schemaFormat: application/json
          schema:
            $ref: './schemas/register/request.schema.json'
      response:
        contentType: application/cbor
        payload:
          schemaFormat: application/json
          schema:
            $ref: './schemas/register/response.schema.json'

  state:
    address: hyped/{podId}/state
    parameters:
      podId:
        description: the id of the pod.
        default: "0"
    messages:
      update:
        contentType: application/cbor
        payload:
          schemaFormat: application/json
          schema:
            $ref: './schemas/state/update.schema.json'

  logs:
    address: hyped/{podId}/logs
    parameters:
      podId:
        description: the id of the pod.
        default: "0"
    messages:
      logs:
        contentType: application/cbor
        payload:
          schemaFormat: application/json
          schema:
            $ref: './schemas/logs/logs.schema.json'

  warnings:
    address: hyped/{podId}/warnings
    parameters:
      podId:
        description: the id of the pod.
        default: "0"
    messages:
      warnings:
        contentType: application/cbor
        payload:
          schemaFormat: application/json
          schema:
            $ref: './schemas/warnings/warnings.schema.json'

  faults:
    address: hyped/{podId}/faults
    parameters:
      podId:
        description: the id of the pod.
        default: "0"
    messages:
      faults:
        contentType: application/cbor
        payload:
          schemaFormat: application/json
          schema:
            $ref: './schemas/faults/faults.schema.json'

  control_status:
    address: hyped/{podId}/control-status
    parameters:
      podId:
        description: the id of the pod.
        default: "0"
    messages:
      status:
        contentType: application/cbor
        payload:
          schemaFormat: application/json
          schema:
            $ref: './schemas/control-status/status.schema.json'

  heartbeat:
    address: hyped/{podId}/heartbeat
    parameters:
      podId:
        description: the id of the pod.
        default: "0"
    messages:
      ping:
        contentType: application/cbor
        payload:
          schemaFormat: application/json
          schema:
            $ref: './schemas/heartbeat/ping.schema.json'
      pong:
        contentType: application/cbor
        payload:
          schemaFormat: application/json
          schema:
            $ref: './schemas/heartbeat/pong.schema.json'

  measurement:
    address: hyped/{podId}/measurement/{measurementId}
    parameters:
      podId:
        description: the id of the pod.
        default: "0"
      measurementId:
        description: |
          the id of the measurement.
          100: HVAL Green Light Status
          200: HVAL Red Light Status
          300: IMDStatus
          400: HV BMS Status
          500: LV BMS Status
          601: TempSensors
          602: PressureSensors
          603: MotorControllerCmd
        enum:
          - "100"
          - "200"
          - "300"
          - "400"
          - "500"
          - "601"
          - "602"
          - "603"
    messages:
      hvalGreenLightStatus:
        title: HVAL Green Light Status
        summary: Sent when measurementId is 100. No CDDL definition yet.
        contentType: application/cbor
      hvalRedLightStatus:
        title: HVAL Red Light Status
        summary: Sent when measurementId is 200. No CDDL definition yet.
        contentType: application/cbor
      imdStatus:
        title: IMDStatus
        summary: Sent when measurementId is 300.
        contentType: application/cbor
        payload:
          schemaFormat: application/json
          schema:
            $ref: './schemas/measurement/measurement.schema.json#/$defs/imdStatus'
      hvBmsStatus:
        title: HV BMS Status
        summary: Sent when measurementId is 400.
        contentType: application/cbor
        payload:
          schemaFormat: application/json
          schema:
            $ref: './schemas/measurement/measurement.schema.json#/$defs/bmsStatus'
      lvBmsStatus:
        title: LV BMS Status
        summary: Sent when measurementId is 500.
        contentType: application/cbor
        payload:
          schemaFormat: application/json
          schema:
            $ref: './schemas/measurement/measurement.schema.json#/$defs/bmsStatus'
      tempSensors:
        title: TempSensors
        summary: Sent when measurementId is 601.
        contentType: application/cbor
        payload:
          schemaFormat: application/json
          schema:
            $ref: './schemas/measurement/measurement.schema.json#/$defs/tempSensors'
      pressureSensors:
        title: PressureSensors
        summary: Sent when measurementId is 602.
        contentType: application/cbor
        payload:
          schemaFormat: application/json
          schema:
            $ref: './schemas/measurement/measurement.schema.json#/$defs/pressureSensors'
      motorControllerCmd:
        title: MotorControllerCmd
        summary: Sent when measurementId is 603.
        contentType: application/cbor
        payload:
          schemaFormat: application/json
          schema:
            $ref: './schemas/measurement/measurement.schema.json#/$defs/motorControllerCmd'

  controls:
    address: hyped/{podId}/controls
    parameters:
      podId:
        description: the id of the pod.
        default: "0"
    messages:
      command:
        contentType: application/cbor
        payload:
          schemaFormat: application/json
          schema:
            $ref: './schemas/controls/command.schema.json'

operations:
  sendRegisterRequest:
    action: send
    summary: The pod registers itself with the base station.
    channel:
      $ref: '#/channels/register'
    messages:
      - $ref: '#/channels/register/messages/request'
    reply:
      channel:
        $ref: '#/channels/register'
      messages:
        - $ref: '#/channels/register/messages/response'

  sendState:
    action: send
    summary: The pod reports its current state.
    channel:
      $ref: '#/channels/state'
    messages:
      - $ref: '#/channels/state/messages/update'

  sendLogs:
    action: send
    summary: The pod sends its logs.
    channel:
      $ref: '#/channels/logs'
    messages:
      - $ref: '#/channels/logs/messages/logs'

  sendWarnings:
    action: send
    summary: The pod sends its warnings.
    channel:
      $ref: '#/channels/warnings'
    messages:
      - $ref: '#/channels/warnings/messages/warnings'

  sendFaults:
    action: send
    summary: The pod sends its faults.
    channel:
      $ref: '#/channels/faults'
    messages:
      - $ref: '#/channels/faults/messages/faults'

  sendControlStatus:
    action: send
    summary: The pod reports which state transitions it is ready for.
    channel:
      $ref: '#/channels/control_status'
    messages:
      - $ref: '#/channels/control_status/messages/status'

  sendPing:
    action: send
    summary: The pod sends a heartbeat.
    channel:
      $ref: '#/channels/heartbeat'
    messages:
      - $ref: '#/channels/heartbeat/messages/ping'

  receivePong:
    action: receive
    summary: The base station sends a heartbeat.
    channel:
      $ref: '#/channels/heartbeat'
    messages:
      - $ref: '#/channels/heartbeat/messages/pong'

  sendMeasurement:
    action: send
    summary: The pod sends a sensor reading.
    channel:
      $ref: '#/channels/measurement'
    messages:
      - $ref: '#/channels/measurement/messages/hvalGreenLightStatus'
      - $ref: '#/channels/measurement/messages/hvalRedLightStatus'
      - $ref: '#/channels/measurement/messages/imdStatus'
      - $ref: '#/channels/measurement/messages/hvBmsStatus'
      - $ref: '#/channels/measurement/messages/lvBmsStatus'
      - $ref: '#/channels/measurement/messages/tempSensors'
      - $ref: '#/channels/measurement/messages/pressureSensors'
      - $ref: '#/channels/measurement/messages/motorControllerCmd'

  receiveCommand:
    action: receive
    summary: The base station sends an operator command.
    channel:
      $ref: '#/channels/controls'
    messages:
      - $ref: '#/channels/controls/messages/command'
