openapi: 3.0.0
info:
  title: Hyped telemetry backend
  description: Telemetry backend documentation

servers:
  - url: http://localhost:8000
    description: locally hosted (Testing server) via docker


components:
  schemas:
    OpenMctFault:
      properties:
        type:
          type: string
        fault:
          type: object
          properties:
            acknowledged: 
              type: boolean
            currentValueInfo:
              type: object
              properties:
                value: 
                  type: number
                rangeCondition:
                  type: string
                monitoringResult:
                  type: string
              required:
                - value
                - rangeCondition
                - monitoringResult
            id:
              type: string
            name:
              type: string
            namespace:
              type: string
            seqNum:
              type: number
            severity:
              type: string
            shelved:
              type: boolean
            shortDescription:
              type: string
            triggerTime:
              type: string
            triggerValueInfo:
              type: object
              properties:
                value:
                  type: number
                rangeCondition:
                  type: string
                monitoringResult:
                  type: string
              required:
                - value
                - rangeCondition
                - monitoringResult
        required:
          - acknowledged
          - currentValueInfo
          - id
          - name
          - namespace
          - seqNum
          - severity
          - shelved
          - shortDescription
          - triggerTime
          - triggerValueInfo
      required:
        - type
        - fault
    MeasurementReadingSchema:
      properties:
        podId:
          type: number
        measurementKey:
          type: string
        timestamp:
          type: string
        value:
          type: number
      required:
        - podId
        - measurementKey
    limit:
      properties:
        low:
          type: number
        high:
          type: number
      required:
        - low
        - high

    OpenMCTMeasurementLimits:
      properties:
        critical:
          type: object
          $ref: "#/components/schemas/limit"
        warning:
          type: object
          $ref: "#/components/schemas/limit"
      required:
        - critical
          
    OpenMCTMeasurementValues:
      properties:
        key:
          type: string
        name:
          type: string
        unit:
          type: string
        format:
          type: string
        min:
          type: number
        max:
          type: number
        limits:
          type: object
          $ref: "#/components/schemas/OpenMCTMeasurementLimits"
        enumerations:
          type: object
          properties:
            value:
              type: string
            string:
              type: string
          required:
            - value
            - string
        hints:
          type: object
          properties:
            range:
              type: number
            domain:
              type: number
        source:
          type: string
        units:
          type: object
          properties:
            domain:
              type: string
          required:
            - domain
        
      required:
        - key
        - name
        - format
    OpenMCTMeasurement:
      properties:
        name:
          type: string
        key:
          type: string
        type:
          type: string
        values:
          type: array
          items:
            type: object
            $ref: "#/components/schemas/OpenMCTMeasurementValues"
      required:
        - name
        - key
        - type
        - values

    OpenMCTMeasurementHistorical:
      properties:
        id:
          type: string
        timestamp:
          type: string
        value:
          type: object
          $ref: "#/components/schemas/OpenMCTMeasurement"
      required:
        - id
        - timestamp
        - value

    OpenMCTPod:
      properties:
        id:
          type: string
        name:
          type: string
        measurements:
          type: array 
          items:
            type: object
            $ref: "#/components/schemas/OpenMCTMeasurement"
      required:
        - id
        - name
        - measurements

    OpenMctObjectType:
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        icon:
          type: string
      required:
        - id
        - name
        - icon

paths:
  /auth/login:
    get:
      summary: Login, it should put a request to the database and return a session token and save that to the cookies
    tags:
      - authentication
  /auth/signup:
    get:
      summary: signup
    tags:
      - authentication
  /auth/signout:
    get:
      summary: Signout action, it should remove the session token from the client's browser
    tags:
      - authentication

  /protected-api/hyped/{podId}/controls/levitation_height:
    post:
      summary: Sets levitation height for a pod, Subscriber (Pod), Publisher (Telemetry Server)
      parameters:
        - in: path
          name: podID
          schema:
            type: string
          required: true
      responses:
        "200":
          description: OK
        "401":
          description: Unauthorized
        "404":
          description: Pods not found
    tags:
      - Auth required
      - MQTT Message
  /protected-api/hyped/{podId}/controls/{control}:
    post:
      summary: Sends Control Commands to pod, Subscriber (Pod), Publisher (Telemetry Server)
      parameters:
        - in: path
          name: podID
          schema:
            type: string
          required: true
        - in: path
          name: control
          schema:
            type: string 
          required: true
      responses:
        "200":
          description: OK
        "401":
          description: Unauthorized
        "404":
          description: Pods not found
    tags:
      - Auth required
      - MQTT Message
  /ping:
    get:
      summary: return pong in return
      responses:
        "200":
          description: return ping
          content:
            plain/text:
              schema:
                type: string
                example: pong
          
    tags:
      - Auth required
      - testing

  /protected-api/openmct/dictionary/pods:
    get:
      summary: Returns the IDs of all the pods. It reads the IDS from a config file (?Somewhere?)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: string
        "401":
          description: Unauthorized
    tags:
      - Auth required
      - OpenMCTModule

  /protected-api/openmct/dictionary/pods/{podID}:
    get:
      summary: Returns the information of the pod at the moment
      parameters:
        - in: path
          name: podID
          schema:
            type: string
          required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                $ref: "#/components/schemas/OpenMCTPod"
        "401":
          description: Unauthorized
    tags:
      - Auth required
      - OpenMCTModule
  
  /protected-api/openmct/dictionary/pods/{podId}/measurements/{measurementKey}:
    get:
      summary: Returns this specific measurement from this specific pod at the moment
      parameters:
        - in: path
          name: podID
          schema:
            type: string
          required: true
        - in: path
          name: measurementKey
          schema:
            type: string
          required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                $ref: "#/components/schemas/OpenMCTMeasurement"
        "401":
          description: Unauthorized
    tags:
      - Auth required
      - OpenMCTModule
  /protected-api/openmct/data/historical/pods/{podId}/measurements/{measurementKey}:
    get:
      summary: Returns the historical data of this specific measurement from this specific pod in the provided timeframe
      parameters:
        - in: path
          name: podID
          schema:
            type: string
          required: true
        - in: path
          name: measurementKey
          schema:
            type: string
          required: true
        - in: query
          name: start
          schema:
            type: integer
          required: true
        - in: query
          name: end
          schema:
            type: integer
          required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array 
                items:
                  type: object
                  $ref: "#/components/schemas/OpenMCTMeasurementHistorical"
        "401":
          description: Unauthorized
    tags:
      - OpenMCTDataModule
      - Auth required
  /protected-api/openmct/object-types:
    get:
      summary: Returns the object types
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  $ref: "#/components/schemas/OpenMctObjectType"
        "401":
          description: Unauthorized
    tags:
      - OpenMCTModule
      - Auth required
  /protected-api/pods/{podID}/controls/levitation-height:
    post:
      summary: Sets levitation height
      parameters:
        - in: path
          name: podID
          schema:
            type: string
          required: true
        - in: query
          name: height
          schema:
            type: integer
          required: true
      responses:
        "200":
          description: Successful
        "400":
          description: Something went wrong
        "401":
          description: Unauthorized
    tags:
      - PodControlsModule
      - Auth required
  /protected-api/pods/:podId/controls/:control:
    post:
      summary: Publishes control commands
      parameters:
        - in: path
          name: podID
          schema:
            type: string
          required: true
        - in: path
          name: control
          schema:
            type: string
          required: true
      responses:
        "200":
          description: Successful
        "400":
          description: Something went wrong
        "401":
          description: Unauthorized
    tags:
      - PodControlsModule
      - Auth required

  /protected-api/openmct/data/realtime:
    get:
      summary: Subscribe/unsubscribe to measurements & receive specific measurements (ping this every 100ms)
      responses:
        "200":
          description: Successful
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  $ref: "#/components/schemas/MeasurementReadingSchema"
    tags:
      - Websocket
      - Auth required
      - OpenMCTDataModule

  /protected-api/openmct/faults/realtime:
    get:
      summary: Subscribe/unsubscribe to fault & receive faults (ping this every 100ms)
      responses:
        "200":
          description: Successful
          content:
            application/json:
              schema:
                type: object 
                $ref: "#/components/schemas/MeasurementReadingSchema"
    tags:
      - Websocket
      - Auth required
      - FaultModule
  /protected-api/live-logs:
    get:
      summary: Subscribe to logs (ping this every 100ms)
      responses:
        "200":
          description: Successful
          content:
            application/json:
              schema:
                type: string
    tags:
      - Websocket
      - Auth required
      - AppModule

